name: CI/CD Pipeline - Deploy to Cloudflare, Render & GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint and Type Check
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Build Multi-OS Packages
        run: node scripts/build-os.js --os=all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-distribution
          path: dist/

  deploy-github-pages:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-distribution
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trigger-render-deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK_URL != ''
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render.com Webhook
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
